<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

:root{
--bg:#070707;
--panel:#141414;
--card:#2f2f2f;
--border:#4a4a4a;
--red:#e90707;
--red2:#a41010;
--text:#ffffff;
--muted:#ababab;
}

body{
min-height:100vh;
background:var(--bg);
display:flex;
align-items:center;
justify-content:center;
color:var(--text);
}

.wrapper{
width:100%;
max-width:420px;
padding:24px;
}
.panel{
background:rgba(20,20,20,.75);
border:1px solid rgba(80,80,80,.4);
border-radius:42px;
padding:40px;
backdrop-filter:blur(14px);
}

.logo{
display:flex;
justify-content:center;
margin-bottom:12px;
}
.logo svg{height:80px}

h1{
text-align:center;
font-size:20px;
margin-bottom:32px;
}
h1 span{
background:linear-gradient(90deg,var(--red),var(--red2));
-webkit-background-clip:text;
color:transparent;
font-weight:600;
}

.link{
display:flex;
align-items:center;
justify-content:space-between;
padding:16px 18px;
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
text-decoration:none;
color:white;
transition:.25s;
}
.link span{font-size:15px}

.icon{
width:18px;
height:18px;
stroke:var(--muted);
stroke-width:2.4;
fill:none;
transition:.25s;
}
.links {
  display: flex;
  flex-direction: column;
  gap: 14px;
}


.link:hover {
  border-color: #e90707;
  transform: translateX(3px);
}

.left {
  display: flex;
  align-items: center;
  gap: 12px;
  color: white;
}

.left-icon {
  width: 20px;
  height: 20px;
  stroke: #e90707;
  fill: none;
  stroke-width: 2;
}

.link:hover .icon {
  stroke: #e90707;
}

</style>
</head>
