services:
  - type: web_service
    name: angelferno-bot
    env: python
    branch: main
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python fernotest.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_MODE
        value: webhook
      - key: PORT
        value: 8080
