services:
  - type: web_service
    name: angelferno-bot
    env: python
    branch: main
    plan: starter
    buildCommand: python -m pip install --upgrade pip && python -m pip install --no-cache-dir -r requirements.txt && python -c "import requests; print('requests version', requests.__version__)"
    startCommand: python angelinferno-bot.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_MODE
        value: webhook
      - key: PORT
        value: 8080
